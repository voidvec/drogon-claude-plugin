name: Feature request
description: Suggest a new skill, hook check, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We use this repo to grow the plugin. Thanks for proposing something.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the scenario you hit that the plugin doesn't cover yet.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: e.g. a new drogon-gen-xxx skill, a new hook check, or a CLAUDE.md rule group.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / references
      description: Links to drogon docs, source files, or examples that support the request.
    validations:
      required: false