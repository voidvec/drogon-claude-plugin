name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-plugin:
    name: Validate plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifests are valid JSON
        shell: bash
        run: |
          python -c "import json,glob; [json.load(open(f,encoding='utf-8')) for f in glob.glob('.claude-plugin/*.json')+glob.glob('.zcode-plugin/*.json')+glob.glob('hooks/*.json')]; print('manifests OK')"

      - name: Assert expected skill count (22)
        shell: bash
        run: |
          test "$(ls -d skills/*/ | wc -l)" -eq 22
          echo "skill count OK"

      - name: Assert host artifacts generated & versions consistent
        shell: bash
        run: python scripts/gen-host-artifacts.py --check

      - name: Run test suite (structure + hook scanners + hook e2e)
        shell: bash
        run: |
          pip install pytest
          python -m pytest tests/ -v

      - name: Python syntax check for hook
        shell: bash
        run: python -m py_compile hooks/posttooluse.py

      - name: Hook dry-run on a clean payload
        shell: bash
        run: |
          echo '{"tool_name":"Write","tool_input":{"file_path":"/tmp/test.cc","content":"int main(){return 0;}"}}' \
            | bash hooks/post-tool-use | python -c "import json,sys; d=json.load(sys.stdin); assert d == {}; print('hook OK')"

      - name: SessionStart hook dry-run (cross-platform bash path)
        shell: bash
        run: |
          echo '{"hook_event_name":"SessionStart","source":"startup"}' \
            | bash hooks/run-hook.cmd session-start \
            | python -c "import json,sys; d=json.load(sys.stdin); ctx=d['hookSpecificOutput']['additionalContext']; assert 'Skill' in ctx; print('session-start OK', len(ctx), 'chars')"

  smoke-cli:
    name: CLI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build & test deps
        shell: bash
        run: pip install build pytest

      - name: Build + install PyPI CLI in a venv
        shell: bash
        run: |
          python scripts/sync-assets.py
          python -m build
          pip install dist/*.whl

      - name: PyPI CLI smoke — install/verify/upgrade/uninstall into temp project
        shell: bash
        run: python scripts/dev-smoke-test.py

      - name: npm pack + install mock
        shell: bash
        run: |
          npm pack ./npm --pack-destination /tmp
          cd /tmp
          npm init -y >/dev/null
          npm install /tmp/drogon-claude-plugin-*.tgz
          mkdir -p /tmp/target_b
          npx drogon-claude-plugin install --target /tmp/target_b
          npx drogon-claude-plugin verify --target /tmp/target_b
          test -f /tmp/target_b/.drogon-plugin/.claude-plugin/plugin.json
          test -d /tmp/target_b/.drogon-plugin/skills
          npx drogon-claude-plugin upgrade --target /tmp/target_b
          npx drogon-claude-plugin uninstall --target /tmp/target_b
          test ! -e /tmp/target_b/.drogon-plugin
          echo "npm smoke OK"

      - name: npm asset-sync check
        shell: bash
        run: node scripts/sync-assets.mjs --check
