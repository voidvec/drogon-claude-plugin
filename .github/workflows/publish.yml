name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches every version manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG" != "$V" ]; then
            echo "version mismatch: VERSION($V) != tag($TAG) — bump VERSION and run scripts/gen-host-artifacts.py"
            exit 1
          fi
          versions="$(
            python3 - <<'PY'
import json, re
from pathlib import Path
files = [
    ".claude-plugin/plugin.json", ".zcode-plugin/plugin.json",
    ".agents/plugins/marketplace.json", ".codex-plugin/plugin.json",
    "gemini-extension.json", "npm/package.json",
]
for f in files:
    d = json.loads(Path(f).read_text(encoding="utf-8"))
    if f.endswith("marketplace.json"):
        print(d["plugins"][0]["version"])
    else:
        print(d["version"])
init = Path("src/drogon_plugin/__init__.py").read_text(encoding="utf-8")
print(re.search(r'__version__ = "([^"]+)"', init).group(1))
print(re.search(r'PLUGIN_VERSION = "([^"]+)"', init).group(1))
print(re.search(r'^version = "([^"]+)"', Path("pyproject.toml").read_text(encoding="utf-8"), re.M).group(1))
PY
          )"
          echo "tag=$TAG"; echo "$versions"
          for v in $versions; do
            if [ "$v" != "$TAG" ]; then
              echo "version mismatch: '$v' != tag '$TAG'"
              exit 1
            fi
          done
          echo "tag $TAG matches every version manifest"

      - name: Assert host artifacts are up to date
        run: python scripts/gen-host-artifacts.py --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist & wheel
        run: |
          pip install build
          python scripts/sync-assets.py
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          cd npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/RELEASE_TEMPLATE.md
          draft: false
          prerelease: false
          files: |
            dist/drogon_claude_plugin-*.whl
            dist/drogon_claude_plugin-*.tar.gz