name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches all four version files
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          versions="$(
            python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])"
            python3 -c "import json;print(json.load(open('.zcode-plugin/plugin.json'))['version'])"
            python3 -c "import json;print(json.load(open('npm/package.json'))['version'])"
            grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml
            grep -oP '__version__\s*=\s*"\K[^"]+' src/drogon_plugin/__init__.py
            grep -oP 'PLUGIN_VERSION\s*=\s*"\K[^"]+' src/drogon_plugin/__init__.py
          )"
          echo "tag=$TAG"; echo "$versions"
          for v in $versions; do
            if [ "$v" != "$TAG" ]; then
              echo "version mismatch: '$v' != tag '$TAG' — bump all four files before tagging (see PITFALLS 1.1)"
              exit 1
            fi
          done
          echo "tag $TAG matches every version file"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist & wheel
        run: |
          pip install build
          python scripts/sync-assets.py
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          cd npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/RELEASE_TEMPLATE.md
          draft: false
          prerelease: false
          files: |
            dist/drogon_claude_plugin-*.whl
            dist/drogon_claude_plugin-*.tar.gz