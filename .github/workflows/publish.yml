name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Windows runner 的 Python 管道输出默认 cp1252,✅/中文 会抛 UnicodeEncodeError
  PYTHONUTF8: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Assert tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$V" ]; then
            echo "version mismatch: VERSION($V) != tag($TAG) — bump VERSION and run scripts/gen-host-artifacts.py"
            exit 1
          fi
          echo "tag $TAG == VERSION"

      - name: Assert host artifacts and manifest versions
        run: python scripts/gen-host-artifacts.py --check

      - name: Pre-publish gates (consistency + asset sync + full test suite)
        run: |
          pip install -r requirements-dev.txt
          python scripts/sync-assets.py
          node scripts/sync-assets.mjs
          python scripts/check-consistency.py
          python scripts/sync-assets.py --check
          node scripts/sync-assets.mjs --check
          python -m pytest tests/ -q

      - name: Build sdist & wheel
        run: |
          pip install -r requirements-dev.txt
          python scripts/sync-assets.py
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          cd npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/RELEASE_TEMPLATE.md
          draft: false
          prerelease: false
          files: |
            dist/drogon_claude_plugin-*.whl
            dist/drogon_claude_plugin-*.tar.gz